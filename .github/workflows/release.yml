name: Release

# Runs when a v* tag is pushed, or by hand: Actions → Release → Run workflow.
# A manual run publishes the version from src/mangareader/__init__.py as tag v<version>.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: Build portable folder and run self-test
        shell: pwsh
        run: |
          Remove-Item Env:QT_QPA_PLATFORM
          ./packaging/build_windows.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import mangareader; print(mangareader.__version__)"
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "v$version" }
          $zip = Get-ChildItem MangaReader-*-win64.zip | Select-Object -First 1
          gh release create $tag $zip.FullName --target $env:GITHUB_SHA --title "Manga Reader $tag" --notes-file packaging/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit 1 }
