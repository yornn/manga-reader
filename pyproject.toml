[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mangareader"
description = "Portable manga and book reader with snipping and export tools"
requires-python = ">=3.13,<3.14"
dynamic = ["version"]
dependencies = [
    "PySide6-Essentials==6.12.0",
    "pymupdf==2.0",
    "pillow==13.0.0",
    "pillow-jxl-plugin==1.3.8",
    "py7zz==1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-qt==4.5.0",
    "pyinstaller==6.22.3",
]

[project.gui-scripts]
mangareader = "mangareader.app:main"

[tool.setuptools.dynamic]
version = { attr = "mangareader.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mangareader.ui.icons" = ["lucide/*.svg", "lucide/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
